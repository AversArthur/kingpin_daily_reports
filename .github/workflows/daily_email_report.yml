name: Meta Ads Daily Email Report

on:
  schedule:
    # Every day at 08:00 UTC (= 08:00 UK in winter/GMT).
    # During BST (late Mar – late Oct), UK is UTC+1 — change to '0 7 * * *'.
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-daily-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Send daily email report
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python email_reporter.py --daily
